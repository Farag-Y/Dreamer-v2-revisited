defaults:
  - domain: atari  # env, action_repeat, max_episode_length; switch with domain=dmc (see conf/domain/)
  - _self_

# Experiment
seed: 1

# Environment
imagination_horizon: 15

# Training
episodes: 3000
# Reference code: batch 16 with train_every 16 (Atari). The paper uses batch 50 with one update per 4 steps.
batch_size: 16
chunk_size: 50

# Model
cnn_depth: 48
hidden_size: 600
num_classes: 32
num_categorical: 32
belief_size: 600
state_size: 1024
activation_function: elu  # RSSM activation; reference is always ELU here, never configurable/ReLU
dense_hidden_size: 400
dense_activation_function: elu 
lam: 0.95


# Optimisation
learning_rate: 2e-4
actor_learning_rate: 4e-5
critic_learning_rate: 1e-4
critic_target_update_interval: 100
discount_loss_scale: 5.0  # only applied on terminating envs; reference Atari loss_scales.discount
adam_epsilon: 1e-5
weight_decay: 1e-6  # decoupled, not lr-scaled, all params (reference Optimizer._apply_weight_decay)
grad_clip_norm: 100

# Losses
free_nats: 0.0
# kl_scale, actor_grad_mix and actor_entropy_scale are per domain (conf/domain/)
kl_balance_alpha: 0.8


# Hardware
disable_cuda: false

# Evaluation
test: false
test_interval: 25
test_episodes: 10
video_size: 160  # test videos are rendered at video_size x video_size; video_frame_skip is per domain

# Checkpointing
checkpoint_interval: 25
experience_replay_interval: 100  # save experience_replay_{episode}.pt alongside metrics.png every N episodes (0 = disabled)
models: ""
experience_replay_path: ""
r2_enabled: true
r2_bucket: "planet-checkpoints-vastai"
r2_log_path: ""   # path to training log on disk; set to /workspace/training.log on Vast.ai
