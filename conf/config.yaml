defaults:
  - domain: atari  # env, action_repeat, max_episode_length; switch with domain=dmc (see conf/domain/)
  - _self_

# Experiment
seed: 1

# Environment
imagination_horizon: 15

# Training
# prefill_steps, experience_size and train_every are per domain (conf/domain/)
episodes: 3000
pretrain_updates: 100  # gradient updates right after prefill, before the first collected episode
batch_size: 50
chunk_size: 50

# Model
embedding_size: 1024
hidden_size: 200
num_classes: 32
num_categorical: 32
belief_size: 200
state_size: 1024
activation_function: elu  # RSSM activation; reference is always ELU here, never configurable/ReLU
dense_hidden_size: 400  # reward/actor/critic/discount models width. NOTE: the Dreamer v1 paper text says
# "three dense layers of size 300" for all non-encoder/decoder/RSSM networks, but the paper and the
# released reference implementation (danijar/dreamer, dreamer.py:_build_model) do not agree: the actual
# code uses num_units=400 everywhere, and varies depth per network (reward=2 hidden layers, value=3,
# discount/pcont=3, actor=4 hidden layers - not a uniform 3 for all).
dense_activation_function: elu 
lam: 0.95


# Optimisation
learning_rate: 6e-4 #TODO: Revise on learning rate from paper
actor_learning_rate: 8e-5
critic_learning_rate: 1e-4
critic_target_update_interval: 100
discount_loss_scale: 10.0 #Only applied on termenating envs
adam_epsilon: 1e-5
grad_clip_norm: 100

# Losses
free_nats: 0.0
kl_scale: 0.1
kl_balance_alpha: 0.8
actor_grad_mix: 1.0  
actor_entropy_scale: 1e-3


# Hardware
disable_cuda: false

# Evaluation
test: false
test_interval: 25
test_episodes: 10
video_size: 160  # test videos are rendered at video_size x video_size; video_frame_skip is per domain

# Checkpointing
checkpoint_interval: 25
experience_replay_interval: 100  # save experience_replay_{episode}.pt alongside metrics.png every N episodes (0 = disabled)
models: ""
experience_replay_path: ""
r2_enabled: true
r2_bucket: "planet-checkpoints-vastai"
r2_log_path: ""   # path to training log on disk; set to /workspace/training.log on Vast.ai
