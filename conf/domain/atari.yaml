# @package _global_
# Atari (DreamerV2 setup). Pick a game with env=ALE/<Game>-v5, see ATARI_GAMES in env_registry.py.
env: ALE/BankHeist-v5
action_repeat: 4
max_episode_length: 108000

#Data Collection.
prefill_steps: 50000
experience_size: 2000000
train_every: 16
pretrain_updates: 1

discount_model_gamma: 0.995

# Losses (V2 Atari values)
kl_scale: 0.1
actor_grad_mix: 1.0        
actor_entropy_scale: 1e-3

video_frame_skip: 4